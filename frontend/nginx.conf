# ============================================================
# EMR Document Editor - Frontend Nginx 站点配置
# 由 nginx:alpine 主配置 include（最终落盘到 /etc/nginx/conf.d/default.conf）
# 本文件会被 docker-entrypoint 的 envsubst 处理：
#   ${BACKEND_HOST} / ${BACKEND_PORT} 由容器环境变量替换，可在运行时用 -e 覆盖
# ============================================================

# Docker 内嵌 DNS。配合下方变量形式的 proxy_pass，上游主机名在请求期解析，
# 避免名称暂不可解析时 nginx 在启动阶段直接报 “host not found” 退出。
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    server_name localhost;

    # 上游后端地址（envsubst 替换为环境变量值，默认 backend:8080）
    set $backend_host ${BACKEND_HOST};
    set $backend_port ${BACKEND_PORT};

    # 前端静态文件（SPA 路由回退到 index.html）
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理（请求期解析；解析失败返回 502 而非崩溃）
    location /api/ {
        proxy_pass http://$backend_host:$backend_port;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 反向代理（Yjs 协同编辑）
    location /ws/ {
        proxy_pass http://$backend_host:$backend_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
